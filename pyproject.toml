[tool.poetry]
name = "openstrata-sdk"
version = "1.0.0"
description = "OpenStrata Python SDK (import openstrata_sdk)"
authors = ["OpenStrata <openstrata@outlook.com>"]
readme = "README.md"
packages = [{ include = "openstrata_sdk", from = "src" }]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.7"
httpx = "^0.27"
opentelemetry-api = "^1.20"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
ruff = "^0.5"
mypy = "^1.10"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
